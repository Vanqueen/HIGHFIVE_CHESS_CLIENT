<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123729" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CHESSARENA</title>
    <style>
      html,body{margin:0;min-width:320px;min-height:100%;background:#0b1713}
      #root{min-height:100svh}
      .boot-loader{min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box;color:#e8f0eb;font:600 14px system-ui,sans-serif;background:radial-gradient(ellipse at 50% 42%,rgba(50,112,79,.22),transparent 48%),#0b1713}
      .boot-loader__card{width:min(100%,300px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:17px;padding:28px 30px 25px;border:1px solid rgba(115,177,139,.22);border-radius:20px;background:rgba(19,39,30,.88);box-shadow:0 24px 70px #0005}
      .boot-loader__board{width:104px;aspect-ratio:1;border:4px solid #243d30;border-radius:10px;background-color:#dce3c9;background-image:linear-gradient(45deg,#56816a 25%,transparent 25%,transparent 75%,#56816a 75%),linear-gradient(45deg,#56816a 25%,transparent 25%,transparent 75%,#56816a 75%);background-position:0 0,13px 13px;background-size:26px 26px;animation:boot-board 2.8s ease-in-out infinite;display:grid;place-items:center;font-size:38px;color:#f2f4e9;text-shadow:0 2px 3px #0008}
      .boot-loader__brand{letter-spacing:.12em}.boot-loader__brand span{color:#74bd90}
      .boot-loader__text{margin:0;color:#afc0b5;font-size:13px}
      .boot-loader__track{width:100%;height:3px;overflow:hidden;border-radius:5px;background:#ffffff14}.boot-loader__track:after{content:"";display:block;width:38%;height:100%;border-radius:inherit;background:#74bd90;animation:boot-progress 1.5s ease-in-out infinite}
      @keyframes boot-board{50%{transform:rotate(-3deg) scale(1.025)}}@keyframes boot-progress{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
      @media(prefers-reduced-motion:reduce){.boot-loader__board,.boot-loader__track:after{animation-duration:6s}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-loader" role="status" aria-live="polite">
        <div class="boot-loader__card">
          <div class="boot-loader__board" aria-hidden="true">♞</div>
          <div class="boot-loader__brand">CHESS<span>ARENA</span></div>
          <p class="boot-loader__text">Préparation de votre espace de jeu…</p>
          <span class="boot-loader__track" aria-hidden="true"></span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
